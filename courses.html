  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;

      --border: rgba(0,200,255,.10);
      --border-strong: rgba(0,200,255,.22);
      --text-primary: #f7fbff;
      --text-secondary: #c9d5e2;
      --text-muted: #7f91a6;
      --cyan: #00c8ff;
      --cyan-dim: rgba(0,200,255,.08);
      --header-bg: rgba(7,17,29,.88);
      --header-border: rgba(0,200,255,.12);
      --footer-bg: #0a1624;
      --youtube-red: #ff315a;
      --youtube-red-soft: rgba(255, 49, 90, 0.12);
    }

    [data-theme="light"] {
      --bg: #f3f6f8;
      --bg-2: #fbfcfd;

      --bg-4: #dde7ee;

      --bg-card-hover: rgba(255,255,255,.96);
      --border: rgba(0,111,168,.12);
      --border-strong: rgba(0,111,168,.18);
      --text-primary: #102030;
      --text-secondary: #27405d;
      --text-muted: #617790;
      --cyan: #006fa8;
      --cyan-dim: rgba(0,122,168,.08);
      --header-bg: rgba(243,246,248,.92);
      --header-border: rgba(0,111,168,.12);
      --footer-bg: #102030;
      --youtube-red: #d91446;
      --youtube-red-soft: rgba(217, 20, 70, 0.08);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background .3s, color .3s;
    }

    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 38px; height: 38px;
      background: var(--cyan-dim);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      flex-shrink: 0;
      margin-left: .5rem;
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--header-border);
    }
    .header-inner {
      max-width: 1160px; margin: 0 auto;
      padding: 0 2rem;
      display: flex; align-items: center;
      justify-content: space-between;
      height: 78px; gap: 1rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
      color: var(--text-primary);
    }

    .logo-svg {
      height: 46px;
      width: auto;
      display: block;
      overflow: visible;
    }

    nav { display: flex; align-items: center; gap: .1rem; }
    nav a {
      color: var(--text-muted); text-decoration: none;
      font-size: .85rem; font-weight: 600;

    }
    nav a:hover, nav a.active { color: var(--cyan); background: var(--cyan-dim); }
    .nav-cta {
      background: var(--cyan) !important;
      color: #fff !important;
      font-weight: 800 !important; margin-left: .5rem;
      border-radius: 8px !important;
    }
    [data-theme="dark"] .nav-cta { color: #07111d !important; }

    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: .5rem; background: none; border: none; }
    .hamburger span { display: block; width: 22px; height: 2px; background: var(--text-primary); border-radius: 2px; }

    .page-hero {

      position: relative;
      overflow: hidden;

        radial-gradient(ellipse 44% 34% at 18% 76%, rgba(0,100,200,.04) 0%, transparent 60%);
      pointer-events: none;
    }
    .page-hero-inner {
      max-width: 1160px; margin: 0 auto;

    }

      font-size: .8rem; color: var(--text-muted);

    .breadcrumb a { color: var(--text-muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--cyan); }
    .page-eyebrow {
      display: inline-flex; align-items: center;
      background: var(--cyan-dim);
      border: 1px solid var(--border-strong);
      color: var(--cyan);

      letter-spacing: .1em; text-transform: uppercase;
      padding: .4rem 1rem; border-radius: 999px;

      background: var(--cyan-dim);
      border: 1px solid var(--border);
    }

      display: block;
      font-family: var(--font-display);

      color: var(--cyan);
      margin-bottom: .2rem;
    }
    .stat-line span {
      font-size: .82rem;
      color: var(--text-muted);
    }

      gap: .75rem;
      margin-bottom: 1.3rem;
    }
    .module {
      background: var(--cyan-dim);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .9rem 1rem;
    }
    .module strong {
      display: block;
      color: var(--text-primary);
      font-size: .9rem;
      margin-bottom: .2rem;
    }
    .module span {
      font-size: .82rem;
      color: var(--text-muted);
    }
    .course-meta {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .course-meta span {
      font-size: .72rem;

      border-radius: 999px;
      padding: .32rem .7rem;
      text-transform: uppercase;
      letter-spacing: .08em;

      margin-bottom: .25rem;
    }
    .side-item span {
      color: var(--text-muted);
      font-size: .86rem;
    }
